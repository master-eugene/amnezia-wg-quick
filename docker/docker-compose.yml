name: amnezia-wg-quick

services:
  panel:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: amnezia-wg-quick:local
    restart: unless-stopped
    pid: host
    cap_add:
      - SYS_ADMIN
      - NET_ADMIN
    security_opt:
      - apparmor:unconfined
    user: "0:0"
    ports:
      - "${AWG_UI_PORT:-51821}:51821"
    environment:
      PORT: "51821"
      HOST: 0.0.0.0
      DATA_DIR: /data
      TRUST_PROXY: "${TRUST_PROXY:-0}"
      NODE_ENV: production
      AWQ_USE_NSENTER: "1"
    volumes:
      - panel-data:/data
      - /var/lib/amnezia-wg-quick/host-tools/awg:/usr/local/bin/awg:ro
      - /var/lib/amnezia-wg-quick/host-tools/awg-quick:/usr/local/bin/awg-quick:ro
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:51821/api/health').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 8s

volumes:
  panel-data:
