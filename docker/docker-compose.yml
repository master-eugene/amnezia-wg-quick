name: amnezia-wg-quick

services:
  panel:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: amnezia-wg-quick:local
    restart: unless-stopped
    network_mode: host
    cap_add:
      - NET_ADMIN
    security_opt:
      - apparmor:unconfined
    user: "0:0"
    environment:
      PORT: "${AWG_UI_PORT:-51821}"
      HOST: 0.0.0.0
      DATA_DIR: /data
      TRUST_PROXY: "${TRUST_PROXY:-0}"
      NODE_ENV: production
      PATH: /usr/local/libexec/awq-host:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
    volumes:
      - panel-data:/data
      - /var/lib/amnezia-wg-quick:/var/lib/amnezia-wg-quick
      - /etc/amnezia/amneziawg:/etc/amnezia/amneziawg
      - /:/host:ro
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:' + process.env.PORT + '/api/health').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 8s

volumes:
  panel-data:
